<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrSF</title>
  </head>
  <body class="h-screen">
    <div class="bg-noise fixed inset-0 z-50"></div>
    <nav
      class="relative flex items-center justify-between border-b-4 bg-[#F4F4F0] px-6 py-4"
    >
      <a
        href="#"
        class="border-2 bg-[#E60000] px-4 py-1 text-4xl text-white shadow-[4px_4px_0px_rgba(0,0,0,1)] transition-all hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[2px_2px_0px_rgba(0,0,0,1)]"
      >
        P<span class="text-3xl">r</span>SF
      </a>

      <button
        id="mobile-menu-btn"
        class="block border-2 bg-white p-2 shadow-[4px_4px_0px_rgba(0,0,0,1)] transition-all hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[2px_2px_0px_rgba(0,0,0,1)] md:hidden"
      >
        <svg
          class="h-6 w-6 text-black"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="square"
            stroke-linejoin="miter"
            stroke-width="3"
            d="M4 6h16M4 12h16M4 18h16"
          ></path>
        </svg>
      </button>

      <div class="hidden gap-6 md:flex">
        <a
          href="index.html"
          class="border-2 border-transparent px-3 py-1 text-2xl text-black transition-none hover:bg-black hover:text-white"
        >
          HOME
        </a>
        <a
          href="about.html"
          class="border-2 border-transparent px-3 py-1 text-2xl text-black transition-none hover:bg-black hover:text-white"
        >
          ABOUT US
        </a>
        <a
          href="events.html"
          class="border-2 border-transparent px-3 py-1 text-2xl text-black transition-none hover:bg-black hover:text-white"
        >
          EVENTS
        </a>
        <a
          href="resources.html"
          class="border-2 border-transparent px-3 py-1 text-2xl text-black transition-none hover:bg-black hover:text-white"
        >
          RESOURCES
        </a>
      </div>
    </nav>

    <div
      id="mobile-menu"
      class="hidden flex-col border-b-4 bg-[#F4F4F0] md:hidden"
    >
      <a
        href="index.html"
        class="border-b-2 px-6 py-4 text-2xl text-black transition-none hover:bg-black hover:text-white"
        >HOME</a
      >
      <a
        href="about.html"
        class="border-b-2 px-6 py-4 text-2xl text-black transition-none hover:bg-black hover:text-white"
        >ABOUT US</a
      >
      <a
        href="events.html"
        class="border-b-2 px-6 py-4 text-2xl text-black transition-none hover:bg-black hover:text-white"
        >EVENTS</a
      >
      <a
        href="resources.html"
        class="px-6 py-4 text-2xl text-black transition-none hover:bg-black hover:text-white"
        >RESOURCES</a
      >
    </div>
    <main class="p-6 md:p-12">
      <section
        class="bg-prsf-crimson text-prsf text-prsf-yellow border-4 border-black p-8 shadow-[8px_8px_0px_rgba(0,0,0,1)] md:p-16"
      >
        <h1 class="mb-6 text-6xl leading-none font-black uppercase md:text-8xl">
          Educate.<br />Agitate.<br />Organize.
        </h1>

        <p class="mb-8 max-w-2xl text-2xl text-white md:text-3xl">
          Building solidarity and fighting for student rights in the era of
          hyper-imperialism.
        </p>

        <a
          href="#"
          class="bg-prsf-yellow inline-block border-2 px-6 py-3 text-2xl font-bold text-black shadow-[4px_4px_0px_rgba(0,0,0,1)] transition-all hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[2px_2px_0px_rgba(0,0,0,1)]"
        >
          JOIN THE MOVEMENT
        </a>
      </section>
    </main>
  </body>
</html>
